<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: app shell — fixed left rail of modules, a slim top bar with session context, a work area of lists, drawers and document editors. Ledger feel: tabular figures, hairline rules, one teal ink accent. */
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --surface-2:#ECEFEC; --surface-3:#E2E7E3;
  --line:#D6DCD8; --line-strong:#B9C2BD;
  --fg:#18201D; --muted:#5A6661; --faint:#86918C;
  --accent:#0D6B64; --accent-hover:#0A5852; --accent-soft:#DDEEEB; --accent-fg:#FFFFFF;
  --good:#2E7A3C; --good-soft:#E1F0E3; --warn:#9A6200; --warn-soft:#F7ECD6; --crit:#B23A2E; --crit-soft:#F7E1DE;
  --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 24px rgba(20,30,26,.08);
  --overlay:rgba(16,22,20,.42);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px; --r-sm:6px;
  --side-bg:#0F2926; --side-fg:#C8D7D3; --side-faint:#7D958F; --side-line:rgba(255,255,255,.08); --side-hover:rgba(255,255,255,.06); --side-on:rgba(94,201,189,.16); --side-mark:#5EC9BD;
  --c1:#00897B; --c2:#6E7FE8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#181E1C; --surface-2:#1F2624; --surface-3:#28302D;
  --line:#2C3532; --line-strong:#3D4844;
  --fg:#E5EAE7; --muted:#9BA6A1; --faint:#6F7A75;
  --accent:#4DB6AB; --accent-hover:#6CC7BD; --accent-soft:#1D3633; --accent-fg:#06211E;
  --good:#6BC07A; --good-soft:#1C3121; --warn:#E0A84A; --warn-soft:#352A15; --crit:#EE7F72; --crit-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.55); --side-bg:#0B100F; --c1:#1E9E91; --c2:#6F7FE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#181E1C; --surface-2:#1F2624; --surface-3:#28302D;
  --line:#2C3532; --line-strong:#3D4844;
  --fg:#E5EAE7; --muted:#9BA6A1; --faint:#6F7A75;
  --accent:#4DB6AB; --accent-hover:#6CC7BD; --accent-soft:#1D3633; --accent-fg:#06211E;
  --good:#6BC07A; --good-soft:#1C3121; --warn:#E0A84A; --warn-soft:#352A15; --crit:#EE7F72; --crit-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.55); --side-bg:#0B100F; --c1:#1E9E91; --c2:#6F7FE6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:500;color:var(--muted)}
.field>label .req{color:var(--crit)}
.input,select.input,textarea.input{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);width:100%;min-width:0}
textarea.input{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[readonly]{background:var(--surface-2);color:var(--muted)}
.input.err{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.err-msg{font-size:12px;color:var(--crit)}
.hint{font-size:12px;color:var(--faint)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 12px;height:34px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.plain::before{display:none}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{background:var(--accent);color:var(--accent-fg);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-art .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.login-art h1{font-size:clamp(26px,3.2vw,38px);line-height:1.15;max-width:15ch;letter-spacing:-.01em}
.login-art p{max-width:46ch;opacity:.85}
.receipt-art{background:var(--surface);color:var(--fg);border-radius:10px;padding:18px 20px;max-width:340px;box-shadow:0 20px 40px rgba(0,0,0,.25);font-size:12.5px;transform:rotate(-2deg)}
.receipt-art .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.receipt-art .row+.row{border-top:1px dashed var(--line)}
.receipt-art .tot{font-weight:600;font-size:14px;border-top:1px solid var(--fg)!important;margin-top:4px;padding-top:8px}
.login-form-wrap{display:grid;place-items:center;padding:40px 20px}
.login-form{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.login-form h2{font-size:22px}
.login-form .sub{color:var(--muted);margin-top:-8px}
.pw-wrap{position:relative}
.pw-wrap .icon-btn{position:absolute;right:2px;top:2px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{padding:28px 20px}.receipt-art{display:none}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.login-art .logo{background:var(--accent-fg);color:var(--accent)}
.nav{padding:10px 10px 20px;display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:17px;height:17px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--surface-3);color:var(--muted);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-height:56px}
.top .crumb{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .spacer{flex:1}
.session{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{display:none}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1400px;width:100%}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-grid}
  .session .chip.hide-sm{display:none}
  .content{padding:16px}
  .top{padding:10px 16px}
}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:55}

/* ---------- Page header & panels ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font-size:14px}
.panel-body{padding:16px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar .field{min-width:140px;flex:0 1 180px}
.toolbar .field.grow{flex:1 1 240px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.search .input{padding-left:32px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tr.variant td:first-child{padding-left:30px;position:relative}
tr.variant td:first-child::before{content:"";position:absolute;left:16px;top:0;bottom:50%;width:8px;border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}
tr.muted td{color:var(--faint)}
@media (max-width:640px){td{white-space:nowrap}}
tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
.sub-line{display:block;font-size:12px;color:var(--faint)}

/* ---------- KPIs & dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .value{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .foot{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.kpi svg.spark{width:100%;height:36px;margin-top:4px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:1100px){.dash-grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.quick button:hover{border-color:var(--accent);background:var(--accent-soft)}
.quick button svg{width:20px;height:20px;color:var(--accent)}
.quick button span{font-weight:600}
.quick button small{color:var(--muted);font-size:12px}

/* ---------- Document editor ---------- */
.doc-head{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px}
@media (max-width:1000px){.doc-head{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.doc-head{grid-template-columns:1fr}}
.party-card{grid-column:span 2;border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.party-card b{color:var(--fg)}
@media (max-width:560px){.party-card{grid-column:auto}}
.lines td{padding:6px 6px}
.lines .input{height:32px}
.lines .qty{width:58px}.lines .rate{width:88px}.lines .disc{width:58px}.lines .batch{width:84px}.lines .exp{width:124px}.lines td{padding-left:6px;padding-right:6px}
.lines td.mono{white-space:nowrap}
.lines td.desc{min-width:200px}
.disc-wrap{display:flex;gap:4px;align-items:center}
.disc-wrap select{width:52px;padding:0 4px}
.add-line{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.nav a.sub{padding:5px 10px 5px 37px;font-size:12.5px}
.nav a.sub.on::before{display:none}
.nav a.sub.on{background:transparent;color:#fff;font-weight:600}
.combo{position:relative;flex:1 1 320px;max-width:520px}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:var(--shadow);z-index:30;max-height:280px;overflow-y:auto}
.combo-list button{display:flex;width:100%;gap:10px;justify-content:space-between;align-items:center;padding:9px 12px;border:0;background:transparent;cursor:pointer;text-align:left}
.combo-list button:hover,.combo-list button.hi{background:var(--accent-soft)}
.combo-list .meta{font-size:12px;color:var(--faint)}
.doc-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:20px;padding:16px;border-top:1px solid var(--line)}
@media (max-width:820px){.doc-foot{grid-template-columns:1fr}}
.totals{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.totals .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.totals .row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.totals .row.minus span:last-child{color:var(--crit)}
.totals .grand{border-top:1px solid var(--fg);margin-top:6px;padding-top:10px;font-size:17px;font-weight:600}
.totals .words{font-size:12px;color:var(--muted);padding-top:6px}
.tax-note{font-size:12px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted);margin-bottom:8px}
.sticky-actions{position:sticky;bottom:0;z-index:15;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}

/* ---------- Drawer / modal / toast ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:80;display:flex;justify-content:flex-end;animation:fade .15s}
.overlay.center{justify-content:center;align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@keyframes pop{from{transform:scale(.97);opacity:.6}}
.drawer{width:min(640px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;animation:slide .18s;box-shadow:var(--shadow)}
.modal{width:min(520px,100%);max-height:100%;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;animation:pop .15s;box-shadow:var(--shadow);overflow:hidden}
.modal.wide{width:min(860px,100%)}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:16px}
.d-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.d-body{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.d-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.d-foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.addr{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:10px}
.toasts{position:fixed;right:20px;top:68px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 40px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:pop .15s;font-size:13.5px}
.toast svg{width:16px;height:16px;flex:none}
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.channels{grid-template-columns:1fr}}
.channel{border:1px solid var(--line-strong);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.channel.on{border-color:var(--accent);background:var(--accent-soft)}
.channel.off{opacity:.5;cursor:not-allowed}
.channel b{display:flex;align-items:center;gap:8px}
.channel small{color:var(--muted);font-size:12px;word-break:break-all}
.msg-preview{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:13px;white-space:pre-wrap;border:1px solid var(--line)}

/* ---------- Printable invoice preview ---------- */

function spark(vals){const w=200,h=36,max=Math.max(...vals,1);const pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-4-(v/max)*(h-8)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>`}

const salesIn=(a,b)=>S.invoices.filter(i=>i.status!=="Cancelled"&&i.date>=a&&i.date<=b);
const recIn=(a,b)=>S.receipts.filter(r=>r.status!=="Cancelled"&&r.date>=a&&r.date<=b);
const sumG=l=>l.reduce((a,i)=>a+calc(i).grand,0);
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);
/* Horizontal bar list: one hue, value as text beside the bar, hover tooltip on the whole row */
function barList(items,{color="var(--c1)",empty="Nothing to show"}={}){
  if(!items.length)return `<div class="empty" style="padding:24px 16px">${empty}</div>`;
  const max=Math.max(...items.map(x=>x.v),1);
  return `<div class="bars">${items.map(x=>`<div class="bar-row ${x.act?"click":""}" ${x.act||""} data-tip="${esc(JSON.stringify({t:x.l,r:[[x.c||color,x.k||"Amount",money(x.v)]].concat(x.extra||[])}))}"><div class="bar-lab"><span>${esc(x.l)}</span>${x.sub?`<small>${esc(x.sub)}</small>`:""}</div><div class="bar-track"><i style="width:${Math.max(2,x.v/max*100)}%;background:${x.c||color}"></i></div><span class="bar-v">${money0(x.v)}</span></div>`).join("")}</div>`}

function productDrawer(id,opts={}){

function addLine(pid){
  const ed=S.ui.editor;const d=ed.doc;const p=prod(pid);
  if(ed.kind==="invoice"||ed.kind==="declaration"){const loc=ed.kind==="invoice"?invLoc(d):d.from;const b=pickBatch(ed,pid,loc);const same=d.lines.find(l=>l.pid===pid&&(!b||l.batch===b.no));
    if(same){same.qty=(+same.qty||0)+1;toast(`${p.partNo}: quantity now ${same.qty}${same.batch?" in batch "+same.batch:""}`)}
    else{const nl=ed.kind==="invoice"?L(pid,1,p.rate):{pid,qty:1,rate:p.rate};nl.batch=b?b.no:"";nl.exp=b?b.exp:"";d.lines.push(nl);toast(b?`${p.partNo}: batch ${b.no}${b.exp?", expires "+dfmt(b.exp):""}`:`${p.partNo}: none in stock at ${loc}`)}
    render();setTimeout(()=>$("#adder")?.focus(),0);return}
  const ex=d.lines.find(l=>l.pid===pid);
  if(ex){ex.qty=(+ex.qty||0)+1;toast(`${p.partNo}: quantity now ${ex.qty}`)}
  else if(ed.kind==="purchase")d.lines.push({pid,qty:1,rate:p.avgRate||p.rate,gst:p.gst});
  else if(ed.kind==="declaration")d.lines.push({pid,qty:1,rate:p.rate});
  else d.lines.push(L(pid,1,p.rate));
  render();setTimeout(()=>$("#adder")?.focus(),0);
}
function saveDoc(){

    if(k==="invoice"&&d.type==="UPI"&&!d.upiRef.trim())return fail("Enter the UPI reference.");
    if(k==="invoice"){const LL=d.loc||"Hyderabad";const short=d.lines.find(l=>l.qty>availFor(ed,l.pid,LL));if(short){const p=prod(short.pid);return fail(`Only ${availFor(ed,short.pid,LL)} of ${p.partNo} available at ${LL}.`)}const bErr=batchCheck(ed,d.lines,invLoc(d),true);if(bErr)return fail(bErr)}
    const t=calc(d);

      toast(`Quotation ${d.no} saved`);ed.isNew=false;render();return true}

      const short2=d.lines.find(l=>l.qty>availFor(ed,l.pid,L0));if(short2)return fail(`Only ${availFor(ed,short2.pid,L0)} of ${prod(short2.pid).partNo} available at ${L0}.`);
      const old=calc(o).grand;o.lines.forEach(l=>{prod(l.pid).stock[L0]+=+l.qty;batchMove(l.pid,L0,l.batch,+l.qty,l.exp)});d.lines.forEach(l=>{prod(l.pid).stock[L0]-=+l.qty;batchMove(l.pid,L0,l.batch,-l.qty)});
      if(d.type!=="Credit")d.dueDate="";Object.assign(o,JSON.parse(JSON.stringify(d)));
      S.receipts.filter(r=>r.auto&&r.status!=="Cancelled"&&r.alloc.some(a=>a.invId===o.id)).forEach(r=>{r.amount=t.grand;r.alloc=[{invId:o.id,amt:t.grand}]});
      audit("Sale Invoice","Edit",o.no,"Grand total",money0(old),money0(t.grand));S.ui.editor={kind:"invoice",isNew:false,doc:JSON.parse(JSON.stringify(o)),locked:false};render();toast(`Invoice ${o.no} updated`);return true}
    d.no=nextNo("INV","INV");d.status="Saved";if(d.type!=="Credit")d.dueDate="";
    d.lines.forEach(l=>{prod(l.pid).stock[invLoc(d)]-=+l.qty;batchMove(l.pid,invLoc(d),l.batch,-l.qty)});S.invoices.push(d);
    audit("Sale Invoice","Create",d.no,"","","Grand total "+money0(t.grand));
    if(d.type!=="Credit"){S.seq.REC++;const r={id:nid("r"),recId:`REC/26-27/${String(S.seq.REC).padStart(4,"0")}`,recNo:"AUTO",date:d.date,clientId:d.clientId,mode:d.type==="UPI"?"UPI":"Cash",amount:t.grand,alloc:[{invId:d.id,amt:t.grand}],ref:d.upiRef||"",bank:"",chqDate:"",desc:`Auto receipt for ${d.type.toLowerCase()} invoice`,status:"Saved",auto:true};S.receipts.push(r);audit("Receipts","Create",r.recId,"","","Auto from "+d.no)}
    if(d.quoteId){const q=byId(S.quotations,d.quoteId);if(q){const was=q.status;q.status="Converted";q.invoiceNo=d.no;audit("Quotations","Status change",q.no,"Status",was,"Converted")}}
    S.ui.editor={kind:"invoice",isNew:false,doc:JSON.parse(JSON.stringify(d)),locked:!isAdmin()};render();
    sendModal({type:"Sale invoice",doc:d.no,party:client(d.clientId),amount:t.grand,docObj:d});return true;
  }
  if(k==="purchase"){
    if(!d.supplierId)return fail("Pick a manufacturer.");if(!d.supInvNo.trim())return fail("Enter the manufacturer invoice number.");
    if(S.purchases.some(p=>p.id!==d.id&&p.supplierId===d.supplierId&&p.supInvNo.trim().toLowerCase()===d.supInvNo.trim().toLowerCase()))return fail("This manufacturer invoice is already entered.");
    if(!d.lines.length)return fail("Add at least one product.");if(d.lines.some(l=>!(+l.qty>0)||!(+l.rate>0)))return fail("Every line needs a quantity and rate above zero.");
    {const nb=d.lines.find(l=>!String(l.batch||"").trim());if(nb)return fail(`Enter the batch No. for ${prod(nb.pid).partNo}, as printed on the box.`);d.lines.forEach(l=>l.batch=String(l.batch).trim())}
    {const seen={};const dup=d.lines.find(l=>{const k=l.pid+"|"+l.batch.toLowerCase();if(seen[k])return true;seen[k]=1});if(dup)return fail(`${prod(dup.pid).partNo} batch ${dup.batch} is on two lines. Combine them into one.`)}
    if(!ed.isNew){const o=byId(S.purchases,d.id);const pids=[...new Set([...o.lines,...d.lines].map(l=>l.pid))];const q=(arr,pid)=>arr.filter(l=>l.pid===pid).reduce((a,l)=>a+(+l.qty||0),0);const v=(arr,pid)=>arr.filter(l=>l.pid===pid).reduce((a,l)=>a+(+l.qty||0)*(+l.rate||0),0);
      const bad=pids.find(pid=>(prod(pid).stock[o.location]||0)-q(o.lines,pid)+q(d.lines,pid)<0);if(bad)return fail(`${prod(bad).partNo} has already been sold or moved, so its quantity can't go that low.`);

      pids.forEach(pid=>{const p=prod(pid);const st=stockTotal(p);const nst=st-q(o.lines,pid)+q(d.lines,pid);if(nst>0)p.avgRate=r2(Math.max(0,st*p.avgRate-v(o.lines,pid)+v(d.lines,pid))/nst);p.stock[o.location]=(p.stock[o.location]||0)-q(o.lines,pid)+q(d.lines,pid)});
      o.lines.forEach(l=>batchMove(l.pid,o.location,l.batch,-l.qty));d.lines.forEach(l=>batchMove(l.pid,o.location,l.batch,+l.qty,l.exp,d.date));const old=purchaseCalc(o).total;Object.assign(o,JSON.parse(JSON.stringify(d)));audit("Purchase","Edit",o.no,"Total",money0(old),money0(purchaseCalc(o).total));S.ui.editor={kind:"purchase",isNew:false,doc:JSON.parse(JSON.stringify(o)),locked:false};render();toast(`Purchase ${o.no} updated`);return true}
    d.lines.forEach(l=>{const p=prod(l.pid);const st=stockTotal(p);const old=p.avgRate;p.avgRate=r2((st*p.avgRate+(+l.qty)*(+l.rate))/(st+(+l.qty)));p.stock[d.location]=(p.stock[d.location]||0)+(+l.qty);audit("Product Master","Edit",p.partNo,"Average purchase rate",money(old),money(p.avgRate),"From purchase")});
    d.lines.forEach(l=>batchMove(l.pid,d.location,l.batch,+l.qty,l.exp,d.date));d.no=nextNo("PUR","PUR");d.status="Saved";S.purchases.push(d);audit("Purchase","Create",d.no,"","",money0(purchaseCalc(d).total));
    S.ui.editor={kind:"purchase",isNew:false,doc:JSON.parse(JSON.stringify(d)),locked:!isAdmin()};render();

function autoAlloc(){const r=S.ui.recDraft,ex=S.ui.recEx;let left=+r.amount||0;r.alloc=[];
  S.invoices.filter(i=>i.clientId===r.clientId&&i.status!=="Cancelled").sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>{const bal=balanceOf(i)+(ex?(ex.alloc.find(x=>x.invId===i.id)?.amt||0):0);if(left>0&&bal>0){const amt=r2(Math.min(bal,left));r.alloc.push({invId:i.id,amt});left=r2(left-amt)}})}
function refreshRec(focusId){const pos=focusId&&$("#"+focusId)?$("#"+focusId).selectionStart:null;$("#recBody").innerHTML=receiptBody();if(focusId&&$("#"+focusId)){const el=$("#"+focusId);el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
function saveReceipt(print){
  const r=S.ui.recDraft,ex=S.ui.recEx;const errs=[];const mark=(s,ok)=>{if(!$(s))return;$(s).classList.toggle("err",!ok);if(!ok)errs.push(s)};
  mark("#rcNo",!!String(r.recNo).trim()&&!S.receipts.some(x=>x.id!==r.id&&x.recNo===String(r.recNo).trim()));mark("#rcClient",!!r.clientId);mark("#rcAmt",+r.amount>0);if(r.mode!=="Cash")mark("#rcRef",!!String(r.ref).trim());
  const allocSum=r.alloc.reduce((a,x)=>a+x.amt,0);if(allocSum>(+r.amount||0)+0.01){toast("Settled amount is more than the receipt amount.");return}
  if(errs.length){toast(errs.includes("#rcNo")&&String(r.recNo).trim()?"That Rec. No. is already used this year.":"Fix the highlighted fields.");$(errs[0]).focus();return}
  r.amount=+r.amount;
  if(ex){["recNo","date","mode","amount","ref","bank","desc","clientId"].forEach(k=>{if(String(ex[k])!==String(r[k]))audit("Receipts","Edit",ex.recId,k,ex[k],r[k])});Object.assign(ex,r);closeOverlay();render();toast("Receipt updated");return}
  r.id=nid("r");r.recId=nextNo("REC","REC");r.status="Saved";S.receipts.push(r);audit("Receipts","Create",r.recId,"","",money(r.amount));
  closeOverlay();render();toast(`Receipt ${r.recId} saved`+(print?". Printing works in the full app.":""));
  sendModal({type:"Receipt",doc:r.recId,party:client(r.clientId),amount:r.amount});
}

  stock(){const f=rf("stock",{q:"",loc:""});const q=f.q.toLowerCase();const rows=S.products.filter(p=>!q||[p.partNo,p.altNo,p.desc].join(" ").toLowerCase().includes(q));

  batch(){const f=rf("batch",{q:"",loc:"",exp:""});const q=f.q.toLowerCase();

  purch(){const f=rf("purch",{from:"2026-04-01",to:TODAY,sup:""});const rows=S.purchases.filter(p=>p.date>=f.from&&p.date<=f.to&&(!f.sup||p.supplierId===f.sup));let T={b:0,g:0,a:0,t:0};

  due(){const f=rf("due",{from:"2026-04-01",to:TODAY,cat:"",zero:false});const prev=addDays(f.from,-1);

  supLedger(){const s=supplier(S.ui.subReport.id);const f=rf("supdue",{from:"2026-04-01",to:TODAY});const ob=supplierDue(s,addDays(f.from,-1));

const chipFor0=a=>`<span class="chip ${({Create:"good",Edit:"accent",Cancel:"crit","Status change":"warn",Login:"plain",Send:"plain"})[a]||"plain"}">${esc(a)}</span>`;


const FY_MONTHS=[["2026-04","Apr"],["2026-05","May"],["2026-06","Jun"],["2026-07","Jul"],["2026-08","Aug"],["2026-09","Sep"],["2026-10","Oct"]];
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const shortMoney=n=>n>=1e5?"₹"+(n/1e5).toFixed(n%1e5?1:0)+"L":n>=1e3?"₹"+Math.round(n/1e3)+"K":"₹"+n;
function barPath(x,y,w,h){if(h<=0)return"";const r=Math.min(4,h,w/2);return `M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function chartBuckets(from,to){const out=[];if(daysBetween(from,to)<=45){for(let d=from;d<=to;d=addDays(d,1))out.push({l:+d.slice(8)+" "+MON[+d.slice(5,7)-1],full:dfmt(d),f:d,t:d})}
  else{let m=from.slice(0,7);while(m<=to.slice(0,7)){const[y,mo]=m.split("-").map(Number);const last=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);out.push({l:MON[mo-1],full:MON[mo-1]+" "+y,f:m+"-01"<from?from:m+"-01",t:last>to?to:last});m=mo===12?(y+1)+"-01":y+"-"+String(mo+1).padStart(2,"0")}}return out}
function salesChart(from="2026-04-01",to=TODAY){
  const daily=daysBetween(from,to)<=45;
  const data=chartBuckets(from,to).map(b=>({...b,inv:S.invoices.filter(i=>i.status!=="Cancelled"&&i.date>=b.f&&i.date<=b.t).reduce((a,i)=>a+calc(i).grand,0),rec:S.receipts.filter(r=>r.status!=="Cancelled"&&r.date>=b.f&&r.date<=b.t).reduce((a,r)=>a+r.amount,0)})).filter(d=>d.inv>0||d.rec>0);
  /* Only dates (or months) with sales or receipts get a bar */
  if(!data.length)return '<div class="empty"><strong>No sales or receipts in this period</strong>Pick another period to see the chart.</div>';
  const every=Math.ceil(data.length/12);
  const W=640,H=230,L=48,Rp=8,T=10,B=26;const max=niceMax(Math.max(...data.map(d=>Math.max(d.inv,d.rec))));
  const gw=(W-L-Rp)/data.length,bw=Math.min(20,gw*.28),y=v=>T+(H-T-B)*(1-v/max);
  let g="";for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${L}" x2="${W-Rp}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1" ${k?'stroke-dasharray="2 4"':""}/><text x="${L-8}" y="${yy+4}" text-anchor="end">${shortMoney(v)}</text>`}
  const bars=data.map((d,i)=>{const cx=L+gw*i+gw/2;const x1=cx-bw-1,x2=cx+1;const tip=esc(JSON.stringify({t:d.full,r:[["var(--c1)","Invoiced",money(d.inv)],["var(--c2)","Received",money(d.rec)]]}));
    return `<g class="grp" data-tip="${tip}"><rect class="hl" x="${L+gw*i+2}" y="${T}" width="${gw-4}" height="${H-T-B}" rx="6"/><path d="${barPath(x1,y(d.inv),bw,H-B-y(d.inv))}" fill="var(--c1)"/><path d="${barPath(x2,y(d.rec),bw,H-B-y(d.rec))}" fill="var(--c2)"/>${i%every===0?`<text x="${cx}" y="${H-8}" text-anchor="middle">${d.l}</text>`:""}</g>`}).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Invoiced and received amounts by ${daily?"day":"month"}">${g}${bars}</svg></div>
  <details class="tv"><summary>Show as table</summary><div class="table-wrap"><table><thead><tr><th>${daily?"Date":"Month"}</th><th class="num">Invoiced</th><th class="num">Received</th></tr></thead><tbody>${data.map(d=>`<tr><td>${d.full}</td><td class="num">${money(d.inv)}</td><td class="num">${money(d.rec)}</td></tr>`).join("")}</tbody></table></div></details>`;
}
document.addEventListener("mousemove",e=>{const tip=$("#tip");const el=e.target.closest&&e.target.closest("[data-tip]");if(!el){if(!tip.hidden)tip.hidden=true;return}
  const d=JSON.parse(el.dataset.tip);tip.innerHTML=`<b>${esc(d.t)}</b>`+d.r.map(([c,l,v])=>`<div class="tip-row"><span><i class="sw" style="background:${c}"></i> ${esc(l)}</span><span>${esc(v)}</span></div>`).join("");tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-10;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+16;tip.style.left=x+"px";tip.style.top=y+"px"});

function palItems(q){
  q=q.trim().toLowerCase();const out=[];const has=(...t)=>!q||t.join(" ").toLowerCase().includes(q);
  NAV.flatMap(g=>g[1]).forEach(([k,l,i])=>{if(has(l,"go"))out.push({g:"Go to",l,i,s:"",run:()=>go(k)})});

function bindAdder(){
  const inp=$("#adder");if(!inp)return;const list=$("#adderList");let hi=0,items=[];
  const active=S.products.filter(p=>p.status==="Active");
  const draw=()=>{const q=inp.value.trim().toLowerCase();if(!q){list.hidden=true;return}
    items=active.filter(p=>[p.partNo,p.altNo,p.desc].join(" ").toLowerCase().includes(q)).slice(0,8);
    list.innerHTML=items.length?items.map((p,i)=>`<button type="button" class="${i===hi?"hi":""}" data-pid="${p.id}"><span><span class="mono">${esc(p.partNo)}</span> · ${esc(p.desc)}<span class="meta" style="display:block">${p.base?"Variant · ":""}${esc(supplier(p.supplierId)?.name||"")}</span></span><span class="meta mono" style="text-align:right">${p.stock[S.session.location]||0} in stock at ${esc(S.session.location)} · ${money(p.rate)}<span style="display:block">${LOCATIONS.filter(l=>l!==S.session.location).map(l=>`${esc(l)} ${p.stock[l]||0}`).join(" · ")}</span></span></button>`).join(""):`<div class="empty" style="padding:14px">No active product matches. Inactive products can't be billed.</div>`;list.hidden=false};

function tableData(tbl){const txt=c=>{const x=c.cloneNode(true);x.querySelectorAll(".sub-line").forEach(e=>e.prepend(" · "));return x.textContent.replace(/\s+/g," ").trim()};
  const rows=[...tbl.querySelectorAll("tr")].map(tr=>{const out=[];[...tr.children].forEach(c=>{out.push(txt(c));for(let k=1;k<(+c.getAttribute("colspan")||1);k++)out.push("")});return out});
  return{head:rows[0],body:rows.slice(1)}}
function buildPdf(title,head,body){
  const W=842,H=595,M=28;let fs=7.5,lh=11;const asc=s=>String(s).replace(/₹/g,"Rs.").replace(/[−–—]/g,"-").replace(/·/g,"-").replace(/[^\x20-\x7E]/g,"");
  const pe=s=>asc(s).replace(/[\\()]/g,"\\$&");const tw=s=>asc(s).length*fs*0.6;
  const n=head.length;const want=head.map((h,c)=>Math.min(170,Math.max(tw(h),...body.map(r=>tw(r[c]||"")))+8));let sum=want.reduce((a,b)=>a+b,0);const k0=Math.max(5.5/7.5,Math.min(1,(W-2*M)/sum));fs*=k0;lh*=Math.max(.85,k0);sum*=k0;const cw=want.map(w=>w*k0*(W-2*M)/sum);
  const fit=(s,w)=>{s=asc(s);const max=Math.floor((w-6)/(fs*0.6));return s.length>max?s.slice(0,Math.max(1,max-1))+".":s};
  const num=s=>/^-?(Rs\.)?-?[\d,]+(\.\d+)?$/.test(asc(s).replace(/\s/g,""));
  const pages=[];let ops=[],y;const newPage=()=>{ops=[];pages.push(ops);y=H-M;ops.push(`BT /F2 11 Tf ${M} ${y-11} Td (${pe(COMPANY.name+" - "+title)}) Tj ET`);y-=28;row(head,true)};
  const row=(r,bold)=>{if(y-lh<M){newPage()}let x=M;if(bold)ops.push(`0.92 g ${M} ${y-lh+2} ${W-2*M} ${lh} re f 0 g`);r.forEach((v,c)=>{const t=fit(v,cw[c]);const tx=num(v)&&!bold?x+cw[c]-3-tw(t):x+3;ops.push(`BT /${bold?"F2":"F1"} ${fs} Tf ${tx.toFixed(1)} ${(y-lh+4.5).toFixed(1)} Td (${pe(t)}) Tj ET`);x+=cw[c]});ops.push(`0.8 G ${M} ${(y-lh+1).toFixed(1)} m ${W-M} ${(y-lh+1).toFixed(1)} l S 0 G`);y-=lh};
  newPage();body.forEach((r,k)=>row(r,k===body.length-1&&/^(Total|Net)/.test(r[0]||"")));
  const objs=["<< /Type /Catalog /Pages 2 0 R >>",null,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>","<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>"];const kids=[];
  pages.forEach((o,k)=>{o.push(`BT /F1 7 Tf ${W-M-60} ${M-14} Td (Page ${k+1} of ${pages.length}) Tj ET`);const c=o.join("\n");objs.push(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${objs.length} 0 R >>`);kids.push(objs.length+" 0 R")});
  objs[1]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${kids.length} >>`;
  let out="%PDF-1.4\n";const off=[];objs.forEach((o,k)=>{off.push(out.length);out+=`${k+1} 0 obj\n${o}\nendobj\n`});const xr=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;return out}
async function exportReport(fmt,el){
  const panel=el.closest(".panel");const tbl=panel&&panel.querySelector("table");if(!tbl){toast("Nothing to export.");return}
  const title=panel.querySelector(".panel-head h2")?.textContent||"Report";const {head,body}=tableData(tbl);
  const filename=title.replace(/[^\w]+/g,"_")+(fmt==="xls"?".csv":".pdf");
  const data=fmt==="xls"?"﻿"+[head,...body].map(r=>r.map(v=>/^[−-]?₹[\d,]+(\.\d+)?$/.test(v)?v.replace(/[₹,]/g,"").replace("−","-"):`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n"):buildPdf(title,head,body);
  let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}
  if(dl){try{await dl.save({filename,data});toast(`${title} saved`)}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the file here.")}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:fmt==="xls"?"text/csv":"application/pdf"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast(`${title} exported`)}catch(e){toast("Export works in the full app.")}
}

  payType:el=>{const p=readPay();p.payType=el.dataset.v;p.head="";p.paidTo="";document.querySelectorAll("#payForm .seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===p.payType));$("#payFields").innerHTML=payFields(p)},
  navReport:(el,e)=>{e.preventDefault();S.ui.report=el.dataset.id;S.ui.subReport=null;go("reports")},
  savePayment:()=>savePayment(),
  newHead:()=>{readPay();newHeadModal()},
  addHead:()=>{const n=$("#nhName").value.trim(),m=$("#nhMain").value;if(!n){$("#nhName").classList.add("err");return}if(S.expenseHeads.some(h=>h.name.toLowerCase()===n.toLowerCase()&&h.main===m)){toast("That expense head already exists.");return}S.expenseHeads.push({name:n,main:m});audit("Cash Transfer","Create","Expense head","",""," "+n+" ("+m+")");$("#ov2").remove();const p=S.ui.payDraft;if(p){p.payType=m;p.head=n;document.querySelectorAll("#payForm .seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===m));$("#payFields").innerHTML=payFields(p)}toast(`${n} added`)},
  openReceipt:el=>receiptDrawer(el.dataset.id),
  autoAlloc:()=>{autoAlloc();refreshRec()},
  allocToggle:el=>{const r=S.ui.recDraft,ex=S.ui.recEx;const id=el.dataset.id;const i=r.alloc.findIndex(a=>a.invId===id);if(i>=0)r.alloc.splice(i,1);else{const inv=byId(S.invoices,id);const bal=balanceOf(inv)+(ex?(ex.alloc.find(x=>x.invId===id)?.amt||0):0);const used=r.alloc.reduce((a,x)=>a+x.amt,0);const left=Math.max(0,(+r.amount||0)-used);r.alloc.push({invId:id,amt:r2(left>0?Math.min(bal,left):bal)})}refreshRec()},
  saveReceipt:el=>saveReceipt(!!el.dataset.print),
  bounce:()=>{const ex=S.ui.recEx;audit("Receipts","Cancel",ex.recId,"Status","Saved","Cancelled","Cheque bounced");ex.status="Cancelled";closeOverlay();render();toast(`${ex.recId} reversed. Invoice balances are restored.`)},
  report:el=>{S.ui.report=el.dataset.id;S.ui.subReport=null;render()},
  clientRates:el=>{S.ui.subReport={kind:"clientRates",id:el.dataset.id};render()},
  ledger:el=>{S.ui.subReport={kind:"ledger",id:el.dataset.id};render()},
  backReport:()=>{S.ui.subReport=null;render()},
  export:el=>exportReport(el.dataset.fmt,el),
  supLedger:el=>{S.ui.subReport={kind:"supLedger",id:el.dataset.id};render()},
  sendStatement:el=>{const c=client(el.dataset.id);sendModal({type:"Statement of account",doc:c.code,party:c,amount:clientDue(c)})},
  msgTab:el=>{S.ui.msgTab=el.dataset.v;render()},
  resend:el=>{const m=S.messages[+el.dataset.i];m.status="Queued";m.reason="";audit("Messaging","Send",m.doc,"","","Resent on "+m.channel);render();toast("Message queued again")},
  saveAuto:()=>toast("Reminder settings saved"),
  ftab:el=>{const f=S.ui.filters[el.dataset.key]||(S.ui.filters[el.dataset.key]={q:""});f.st=el.dataset.v;render()},
  toggleMini:()=>{S.ui.sideMini=!S.ui.sideMini;try{localStorage.setItem("bd.sideMini",S.ui.sideMini?"1":"0")}catch(e){}render()},
  toggleRep:()=>{S.ui.repOpen=!S.ui.repOpen;render()},
  dashPeriod:el=>{S.ui.dashPeriod=el.dataset.v;render()},
  reportFromDash:el=>{S.ui.report=el.dataset.id;S.ui.subReport=null;go("reports")},
  ledgerFromDash:el=>{S.ui.report="due";S.ui.subReport={kind:"ledger",id:el.dataset.id};go("reports")},
  palette:()=>openPalette(),palRun:el=>runPal(+el.dataset.i)
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const fn=A[el.dataset.act];if(fn)fn(el,e)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter]($("[data-act=\""+e.target.dataset.enter+"\"]")||e.target,e);return}if(e.key==="Escape"){if($("#ov2"))$("#ov2").remove();else closeOverlay()}if((e.key===" "||e.key==="Enter")&&e.target.matches(".channel[data-act]")){e.preventDefault();e.target.click()}});
let filterTimer;
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.filter){const[key,prop]=t.dataset.filter.split(".");S.ui.filters[key]=S.ui.filters[key]||{};S.ui.filters[key][prop]=t.type==="checkbox"?t.checked:t.value;const id=t.id;const pos=t.selectionStart;
    clearTimeout(filterTimer);filterTimer=setTimeout(()=>{render();const n=id&&document.getElementById(id);if(n){n.focus();try{if(pos!=null&&n.setSelectionRange)n.setSelectionRange(pos,pos)}catch(_){}}},t.tagName==="INPUT"&&t.type!=="date"&&t.type!=="checkbox"?160:0);return}
  const ed=S.ui.editor;
  if(ed&&t.dataset.line!=null){const l=ed.doc.lines[+t.dataset.line];const f=t.dataset.lf;l[f]=["dt","batch","exp"].includes(f)?t.value:(t.value===""?"":+t.value||0);if(f==="batch"&&t.tagName==="SELECT"){const b=findBatch(l.pid,ed.kind==="declaration"?ed.doc.from:invLoc(ed.doc),l.batch);l.exp=b?b.exp:"";render();return}if(f==="batch"||f==="exp")return;softRefresh(t);return}
  if(ed&&t.dataset.add!=null){const a=ed.doc.additions[+t.dataset.add];a[t.dataset.af]=t.dataset.af==="amt"?(+t.value||0):t.value;softRefresh(t);return}
  if(ed&&t.dataset.doc){const k=t.dataset.doc;ed.doc[k]=["billDisc","transport"].includes(k)?(+t.value||0):t.value;
    if(k==="trBy"){render();return}
    if(k==="addrId"){render();return}
    if(k==="clientId"){const c=client(t.value);ed.doc.addrId=c?(c.addresses.find(a=>a.def)||c.addresses[0]).id:"";if(c&&!ed.doc.fe)ed.doc.fe=c.fe||"";render();return}
    if(["addrId","supplierId","to","date","type","consignee","purpose","billDt"].includes(k)||t.tagName==="SELECT"){if(k==="date"&&ed.kind==="invoice"&&ed.doc.type==="Credit")ed.doc.dueDate=addDays(t.value,30);render();return}
    softRefresh(t);return}
  if(t.dataset.rec){const r=S.ui.recDraft;r[t.dataset.rec]=t.value;if(t.dataset.rec==="clientId"){r.alloc=[];if(r.amount)autoAlloc();refreshRec();return}if(t.dataset.rec==="amount"){autoAlloc();refreshRec(t.id);return}if(t.dataset.rec==="mode"){refreshRec();return}return}
  if(t.id==="pyMode"){const p=readPay();$("#payFields").innerHTML=payFields(p);return}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.filter&&(t.tagName==="SELECT"||t.type==="checkbox")){/* handled by input */}});
function softRefresh(t){
  // Re-render the editor but keep the caret where the user is typing.
  const id=t.id,line=t.dataset.line,lf=t.dataset.lf,add=t.dataset.add,af=t.dataset.af,doc=t.dataset.doc;const pos=t.selectionStart;
  clearTimeout(softRefresh.t);softRefresh.t=setTimeout(()=>{render();let n=null;
    if(line!=null)n=document.querySelector(`[data-line="${line}"][data-lf="${lf}"]`);else if(add!=null)n=document.querySelector(`[data-add="${add}"][data-af="${af}"]`);else if(doc)n=document.querySelector(`[data-doc="${doc}"]`);else if(id)n=document.getElementById(id);
    if(n){n.focus();try{if(pos!=null&&n.setSelectionRange)n.setSelectionRange(pos,pos)}catch(_){}}},220);
}
seedFixups();seedBatches();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>S.session&&render());
render();
</script>
