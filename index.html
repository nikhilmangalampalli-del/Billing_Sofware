<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing Desk Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — fixed left rail of modules, a slim top bar with session context, a work area of lists, drawers and document editors. Ledger feel: tabular figures, hairline rules, one teal ink accent. */
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --surface-2:#ECEFEC; --surface-3:#E2E7E3;
  --line:#D6DCD8; --line-strong:#B9C2BD;
  --fg:#18201D; --muted:#5A6661; --faint:#86918C;
  --accent:#0D6B64; --accent-hover:#0A5852; --accent-soft:#DDEEEB; --accent-fg:#FFFFFF;
  --good:#2E7A3C; --good-soft:#E1F0E3; --warn:#9A6200; --warn-soft:#F7ECD6; --crit:#B23A2E; --crit-soft:#F7E1DE;
  --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 24px rgba(20,30,26,.08);
  --overlay:rgba(16,22,20,.42);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px; --r-sm:6px;
  --side-bg:#0F2926; --side-fg:#C8D7D3; --side-faint:#7D958F; --side-line:rgba(255,255,255,.08); --side-hover:rgba(255,255,255,.06); --side-on:rgba(94,201,189,.16); --side-mark:#5EC9BD;
  --c1:#00897B; --c2:#6E7FE8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#181E1C; --surface-2:#1F2624; --surface-3:#28302D;
  --line:#2C3532; --line-strong:#3D4844;
  --fg:#E5EAE7; --muted:#9BA6A1; --faint:#6F7A75;
  --accent:#4DB6AB; --accent-hover:#6CC7BD; --accent-soft:#1D3633; --accent-fg:#06211E;
  --good:#6BC07A; --good-soft:#1C3121; --warn:#E0A84A; --warn-soft:#352A15; --crit:#EE7F72; --crit-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.55); --side-bg:#0B100F; --c1:#1E9E91; --c2:#6F7FE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#181E1C; --surface-2:#1F2624; --surface-3:#28302D;
  --line:#2C3532; --line-strong:#3D4844;
  --fg:#E5EAE7; --muted:#9BA6A1; --faint:#6F7A75;
  --accent:#4DB6AB; --accent-hover:#6CC7BD; --accent-soft:#1D3633; --accent-fg:#06211E;
  --good:#6BC07A; --good-soft:#1C3121; --warn:#E0A84A; --warn-soft:#352A15; --crit:#EE7F72; --crit-soft:#3A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.55); --side-bg:#0B100F; --c1:#1E9E91; --c2:#6F7FE6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:500;color:var(--muted)}
.field>label .req{color:var(--crit)}
.input,select.input,textarea.input{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);width:100%;min-width:0}
textarea.input{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[readonly]{background:var(--surface-2);color:var(--muted)}
.input.err{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.err-msg{font-size:12px;color:var(--crit)}
.hint{font-size:12px;color:var(--faint)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 12px;height:34px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.plain::before{display:none}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{background:var(--accent);color:var(--accent-fg);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-art .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.login-art h1{font-size:clamp(26px,3.2vw,38px);line-height:1.15;max-width:15ch;letter-spacing:-.01em}
.login-art p{max-width:46ch;opacity:.85}
.receipt-art{background:var(--surface);color:var(--fg);border-radius:10px;padding:18px 20px;max-width:340px;box-shadow:0 20px 40px rgba(0,0,0,.25);font-size:12.5px;transform:rotate(-2deg)}
.receipt-art .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.receipt-art .row+.row{border-top:1px dashed var(--line)}
.receipt-art .tot{font-weight:600;font-size:14px;border-top:1px solid var(--fg)!important;margin-top:4px;padding-top:8px}
.login-form-wrap{display:grid;place-items:center;padding:40px 20px}
.login-form{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.login-form h2{font-size:22px}
.login-form .sub{color:var(--muted);margin-top:-8px}
.pw-wrap{position:relative}
.pw-wrap .icon-btn{position:absolute;right:2px;top:2px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{padding:28px 20px}.receipt-art{display:none}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.login-art .logo{background:var(--accent-fg);color:var(--accent)}
.nav{padding:10px 10px 20px;display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:17px;height:17px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--surface-3);color:var(--muted);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-height:56px}
.top .crumb{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .spacer{flex:1}
.session{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{display:none}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1400px;width:100%}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-grid}
  .session .chip.hide-sm{display:none}
  .content{padding:16px}
  .top{padding:10px 16px}
}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:55}

/* ---------- Page header & panels ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font-size:14px}
.panel-body{padding:16px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar .field{min-width:140px;flex:0 1 180px}
.toolbar .field.grow{flex:1 1 240px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.search .input{padding-left:32px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tr.variant td:first-child{padding-left:30px;position:relative}
tr.variant td:first-child::before{content:"";position:absolute;left:16px;top:0;bottom:50%;width:8px;border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}
tr.muted td{color:var(--faint)}
@media (max-width:640px){td{white-space:nowrap}}
tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}
.sub-line{display:block;font-size:12px;color:var(--faint)}

/* ---------- KPIs & dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .value{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .foot{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.kpi svg.spark{width:100%;height:36px;margin-top:4px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:1100px){.dash-grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.quick button:hover{border-color:var(--accent);background:var(--accent-soft)}
.quick button svg{width:20px;height:20px;color:var(--accent)}
.quick button span{font-weight:600}
.quick button small{color:var(--muted);font-size:12px}

/* ---------- Document editor ---------- */
.doc-head{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px}
@media (max-width:1000px){.doc-head{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.doc-head{grid-template-columns:1fr}}
.party-card{grid-column:span 2;border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.party-card b{color:var(--fg)}
@media (max-width:560px){.party-card{grid-column:auto}}
.lines td{padding:6px 6px}
.lines .input{height:32px}
.lines .qty{width:58px}.lines .rate{width:88px}.lines .disc{width:58px}.lines .batch{width:84px}.lines .exp{width:124px}.lines td{padding-left:6px;padding-right:6px}
.lines td.mono{white-space:nowrap}
.lines td.desc{min-width:200px}
.disc-wrap{display:flex;gap:4px;align-items:center}
.disc-wrap select{width:52px;padding:0 4px}
.add-line{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.nav a.sub{padding:5px 10px 5px 37px;font-size:12.5px}
.nav a.sub.on::before{display:none}
.nav a.sub.on{background:transparent;color:#fff;font-weight:600}
.combo{position:relative;flex:1 1 320px;max-width:520px}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:var(--shadow);z-index:30;max-height:280px;overflow-y:auto}
.combo-list button{display:flex;width:100%;gap:10px;justify-content:space-between;align-items:center;padding:9px 12px;border:0;background:transparent;cursor:pointer;text-align:left}
.combo-list button:hover,.combo-list button.hi{background:var(--accent-soft)}
.combo-list .meta{font-size:12px;color:var(--faint)}
.doc-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:20px;padding:16px;border-top:1px solid var(--line)}
@media (max-width:820px){.doc-foot{grid-template-columns:1fr}}
.totals{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.totals .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.totals .row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.totals .row.minus span:last-child{color:var(--crit)}
.totals .grand{border-top:1px solid var(--fg);margin-top:6px;padding-top:10px;font-size:17px;font-weight:600}
.totals .words{font-size:12px;color:var(--muted);padding-top:6px}
.tax-note{font-size:12px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted);margin-bottom:8px}
.sticky-actions{position:sticky;bottom:0;z-index:15;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}

/* ---------- Drawer / modal / toast ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:80;display:flex;justify-content:flex-end;animation:fade .15s}
.overlay.center{justify-content:center;align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@keyframes pop{from{transform:scale(.97);opacity:.6}}
.drawer{width:min(640px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;animation:slide .18s;box-shadow:var(--shadow)}
.modal{width:min(520px,100%);max-height:100%;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;animation:pop .15s;box-shadow:var(--shadow);overflow:hidden}
.modal.wide{width:min(860px,100%)}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:16px}
.d-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.d-body{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.d-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.d-foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.addr{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:10px}
.toasts{position:fixed;right:20px;top:68px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 40px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:pop .15s;font-size:13.5px}
.toast svg{width:16px;height:16px;flex:none}
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.channels{grid-template-columns:1fr}}
.channel{border:1px solid var(--line-strong);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.channel.on{border-color:var(--accent);background:var(--accent-soft)}
.channel.off{opacity:.5;cursor:not-allowed}
.channel b{display:flex;align-items:center;gap:8px}
.channel small{color:var(--muted);font-size:12px;word-break:break-all}
.msg-preview{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:13px;white-space:pre-wrap;border:1px solid var(--line)}

/* ---------- Printable invoice preview ---------- */
.sheet{background:#fff;color:#1a1a1a;padding:28px 30px;font-size:12px;border:1px solid var(--line);border-radius:4px;color-scheme:light}
.sheet table th{background:#f2f2f2;color:#333;position:static}
.sheet th,.sheet td{border-bottom:1px solid #ddd;padding:6px 8px}

 S.docs.filter(d=>d.clientId===cid&&d.status==="Saved").forEach(d=>{if(d.kind==="SI")ent.push({date:d.date,part:`Invoice ${d.number}`,dr:d.t.grand,cr:0,id:d.id});if(d.kind==="CDN")ent.push({date:d.date,part:`Debit note ${d.number}`,dr:d.t.grand,cr:0,id:d.id});if(d.kind==="CN")ent.push({date:d.date,part:`Credit note ${d.number}`,dr:0,cr:d.t.grand,id:d.id});if(d.kind==="RC"&&d.partyType==="Client")ent.push({date:d.date,part:`${d.rkind==="Write-off"?"Write-off":"Receipt"} ${d.number}${d.mode?" · "+d.mode:""}`,dr:0,cr:d.amount,id:d.id});if(d.kind==="PY"&&d.payee==="Client")ent.push({date:d.date,part:`Refund ${d.number}`,dr:d.amount,cr:0,id:d.id})});
 ent.sort((a,b)=>a.date.localeCompare(b.date));let open=0;ent.filter(e=>e.date<from).forEach(e=>open=r2(open+e.dr-e.cr));let run=open;ent.filter(e=>e.date>=from&&e.date<=to).forEach(e=>{run=r2(run+e.dr-e.cr);rows.push({...e,bal:run})});return {rows,open}}

ACTS.brEdit=a=>{const b=a.dataset.id?branch(a.dataset.id):null;const used=b&&S.docs.some(d=>d.branch===b.id);const v=b||{code:"",name:"",state:"36",gstin:"",address:"",phone:"",upi:"",status:"Active"};
 openPanel({title:b?"Edit branch":"New branch",ctx:b?esc(b.name):"",body:`<div class="grid g2">${sf("bC","Code",v.code,{mono:1,ro:used,hint:used?"Locked: documents use this code.":"2 to 4 capital letters."})}${sf("bN","Name",v.name)}<div class="field"><label for="bS">State</label>${stateSel("bS",v.state)}</div>${sf("bG","GSTIN",v.gstin,{mono:1})}${sf("bA","Address",v.address,{cls:"span2"})}${sf("bP","Phone",v.phone)}${sf("bU","UPI ID",v.upi,{hint:"Empty uses the company's."})}<label class="check"><input type="checkbox" id="bAc" ${v.status==="Active"?"checked":""}> Active</label></div>`,
 foot:`<button class="btn" data-act="pclose">Cancel</button><button class="btn primary" id="bGo">Save</button>`,mount:el=>{$("#bGo",el).onclick=()=>{const g=id=>$(id,el).value.trim();const n={code:g("#bC").toUpperCase(),name:g("#bN"),state:g("#bS"),gstin:g("#bG").toUpperCase(),address:g("#bA"),phone:g("#bP"),upi:g("#bU"),status:$("#bAc",el).checked?"Active":"Inactive"};
  if(!/^[A-Z]{2,4}$/.test(n.code))return panelNote(el,"Code is 2 to 4 capital letters.");if(S.branches.some(x=>x.code===n.code&&x!==b))return panelNote(el,"Another branch has this code.");if(!gstinOk(n.gstin))return panelNote(el,"This GSTIN isn't valid.");if(n.gstin.slice(0,2)!==n.state)return panelNote(el,"The GSTIN's first two digits must match the state.");
  closePanel();confirmPw({title:"Save branch",ctx:esc(n.name),summary:"Branch details print on its documents from now on.",action:"Save",cb:r=>{if(b){Object.keys(n).forEach(k=>{if(String(b[k])!==String(n[k]))audit("Company Settings","Edit",b.name,k,b[k],n[k],r)});Object.assign(b,n)}else{S.branches.push(Object.assign({id:uid("b")},n));audit("Company Settings","Create",n.name,"","","",r)}setTimeout(()=>{toast("Branch saved.");render()});return ""}})}}})};
SETSEC.numbering=()=>{const types=["QT","SI","PE","CN","DN","DC","RC","PY","AD"];const fy=sess().fy;return {body:`<div class="panel tw"><div class="ph">Document numbering · FY ${fy}<span class="r faint">Default: branch code, type, year, 5 digits</span></div><table><thead><tr><th>Branch</th>${types.map(t=>`<th>${t==="DN"?"DN (both)":t}</th>`).join("")}</tr></thead><tbody>${S.branches.map(b=>`<tr><td>${b.name}</td>${types.map(t=>{const n=(S.seq[`${b.id}|${t}|${fy}`]||0)+1;return `<td class="mono" style="font-size:11px">${b.code}${t}/${fyShort(fy)}/${String(n).padStart(5,"0")}</td>`}).join("")}</tr>`).join("")}</tbody></table><div class="tnote">Each cell is the next number. One series per branch, document type and year; client and vendor debit notes share the DN series. Invoices, credit notes and debit notes stay within 16 characters (GST rule).</div></div>
 <div class="panel"><div class="ph">Change a format</div><div class="pb"><div class="grid g4"><div class="field"><label for="nB">Branch</label><select id="nB" class="input">${S.branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join("")}</select></div><div class="field"><label for="nT">Type</label><select id="nT" class="input">${types.map(t=>`<option>${t}</option>`).join("")}</select></div>${sf("nD","Digits",5,{type:"number"})}<div class="field"><label>Preview</label><input id="nP" class="input mono" readonly value="HYDQT/2627/00004"></div></div><span class="hint" id="nH"></span></div></div>`,
 mount:()=>{const up=()=>{const b=branch($("#nB").value),t=$("#nT").value,dg=+$("#nD").value||5;const v=`${b.code}${t}/${fyShort(fy)}/${String((S.seq[`${b.id}|${t}|${fy}`]||0)+1).padStart(dg,"0")}`;$("#nP").value=v;$("#nH").textContent=["SI","CN","DN"].includes(t)&&v.length>16?`${v.length} characters: too long for a GST document (16 at most).`:`${v.length} characters.`};["#nB","#nT","#nD"].forEach(s=>$(s).oninput=up);up()}}};
SETSEC.designations=()=>({body:`<div class="panel tw"><div class="ph">Designations<span class="r"><button class="btn sm" data-act="idlePrev">${ic("clock")}Preview the idle warning</button></span></div><table><thead><tr><th>Designation</th><th>Can create</th><th>Can view</th><th class="num">Idle logout (minutes)</th><th></th></tr></thead><tbody>${S.designations.map(d=>`<tr><td><b>${d.name}</b></td><td>${d.name==="Admin"?"Everything":d.name==="Sales"?"Quotations, invoices, receipts, clients":d.name==="Accountant"?"Receipts, payments, purchases, vendors":"Purchases, declarations, adjustments, products"}</td><td>All lists and reports of the branch</td><td class="num"><input class="input num" style="width:70px" data-idle="${d.name}" value="${d.idle}" aria-label="Idle minutes for ${d.name}"></td><td></td></tr>`).join("")}</tbody></table><div class="tnote">Edit, cancel, re-issue and unlock stay Admin-only whatever is ticked. Idle logout is 5 to 60 minutes; a 60-second warning shows first. Every session also ends after 12 hours.</div></div><div style="text-align:right"><button class="btn primary" data-act="idleSave">Save</button></div>`});
ACTS.idlePrev=()=>startCountdown(60);
ACTS.idleSave=()=>{const ch=$$("[data-idle]").map(i=>[S.designations.find(d=>d.name===i.dataset.idle),+i.value]).filter(([d,v])=>d.idle!==v);if(!ch.length)return toast("Nothing changed.");if(ch.some(([,v])=>!(v>=5&&v<=60)))return toast("Idle logout is between 5 and 60 minutes.",true);confirmPw({title:"Save idle timeouts",ctx:ch.map(([d])=>d.name).join(", "),summary:"Takes effect at each login's next activity.",action:"Save",cb:r=>{ch.forEach(([d,v])=>{audit("Designations","Edit",d.name,"idle timeout",d.idle,v,r);d.idle=v});setTimeout(()=>{toast("Saved.");render()});return ""}})};
SETSEC.logins=()=>({body:`<div class="panel tw"><div class="ph">Logins<span class="r faint">One per branch and designation</span></div><table><thead><tr><th>Branch</th><th>Designation</th><th>Status</th><th class="num">Failed attempts</th><th>Last event</th><th></th></tr></thead><tbody>${S.branches.flatMap(b=>S.designations.map(d=>{const L=S.logins[b.id+"|"+d.name];return `<tr><td>${b.name}</td><td>${d.name}</td><td>${L.locked?'<span class="chip crit">Locked</span>':stChip("Active")}</td><td class="num">${L.failed}</td><td>${L.last||"–"}</td><td>${L.locked?(d.name==="Admin"?'<span class="faint">Owner support unlocks Admin</span>':`<button class="btn sm" data-act="unlock" data-k="${b.id}|${d.name}">Unlock</button>`):`<button class="btn sm ghost" data-act="chPw" data-k="${b.id}|${d.name}">Change password</button>`}</td></tr>`})).join("")}</tbody></table><div class="tnote">A login locks after ${S.company.lockout} wrong passwords in a row. Every wrong password, lock and unlock is in the audit log. Try a wrong password on the login page to see it.</div></div>`});
ACTS.unlock=a=>{const [b,d]=a.dataset.k.split("|");confirmPw({title:"Unlock login",ctx:`${d} · ${branch(b).name}`,summary:"The failed-attempt count goes back to zero. Tell the person their password still works.",action:"Unlock",cb:r=>{const L=S.logins[a.dataset.k];L.locked=false;L.failed=0;audit("Logins","Unlock",`${d} · ${branch(b).name}`,"locked","Yes","No",r);setTimeout(()=>{toast("Unlocked.");render()});return ""}})};
ACTS.chPw=a=>{const [b,d]=a.dataset.k.split("|");openPanel({title:"Change password",ctx:`${d} · ${branch(b).name}`,width:"narrow",body:`<div class="grid">${sf("pw1","New password","",{type:"password",hint:"At least 8 characters with a number."})}${sf("pw2","Type it again","",{type:"password"})}${sf("pw3","Your Admin password","",{type:"password"})}</div>`,foot:`<button class="btn" data-act="pclose">Cancel</button><button class="btn primary" id="pwGo">Change</button>`,mount:el=>{$("#pwGo",el).onclick=()=>{const a1=$("#pw1",el).value,a2=$("#pw2",el).value;if(a1.length<8||!/\d/.test(a1))return panelNote(el,"Use at least 8 characters with a number.");if(a1!==a2)return panelNote(el,"The two don't match.");if(!$("#pw3",el).value)return panelNote(el,"Enter your Admin password.");audit("Logins","Edit",`${d} · ${branch(b).name}`,"password","","changed");closePanel();toast("Password changed. Their open sessions end.")}}})};
SETSEC.lists=()=>{const names={modality:"Modality",client_category:"Client category",product_type:"Product type",unit:"Unit",expense_head:"Expense head",transfer_purpose:"Transfer purpose"};S.inactiveVals=S.inactiveVals||{};
 return {body:`<div class="grid g3">${Object.keys(names).map(k=>`<div class="panel"><div class="ph">${names[k]}</div><div class="pb">${S.lists[k].map(v=>{const off=S.inactiveVals[k+"|"+v];return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0"><span class="${off?"faint":""}">${esc(v)}${off?" (inactive)":""}</span><button class="btn sm ghost" data-act="lvToggle" data-k="${k}" data-v="${esc(v)}">${off?"Activate":"Set inactive"}</button></div>`}).join("")}<div style="display:flex;gap:6px;margin-top:8px"><input class="input" id="lv_${k}" placeholder="New value" aria-label="New ${names[k]}"><button class="btn sm" data-act="lvAdd" data-k="${k}">Add</button></div></div></div>`).join("")}</div><p class="hint">A value in use can be set inactive, never removed.</p>`}};
ACTS.lvAdd=a=>{const k=a.dataset.k,v=$("#lv_"+k).value.trim();if(!v)return;if(S.lists[k].some(x=>x.toLowerCase()===v.toLowerCase()))return toast("That value is already there.",true);S.lists[k].push(v);audit("Company Settings","Create","List "+k,"value","",v);render()};
ACTS.lvToggle=a=>{const key=a.dataset.k+"|"+a.dataset.v;S.inactiveVals[key]=!S.inactiveVals[key];audit("Company Settings","Status change","List "+a.dataset.k,a.dataset.v,S.inactiveVals[key]?"Active":"Inactive",S.inactiveVals[key]?"Inactive":"Active");render()};
SETSEC.openings=()=>{const br=sess().branch;const rows=S.openings.filter(o=>o.branch===br);
 return {body:`<div class="panel tw"><div class="ph">Opening balances · ${branch(br).name}<span class="r"><button class="btn sm" data-act="obNew">${ic("plus")}Add</button></span></div><table><thead><tr><th>Party</th><th>Type</th><th>As of</th><th class="num">Amount</th><th class="num">Settled</th><th>State</th></tr></thead><tbody>${rows.map(o=>{const p=o.partyType==="Client"?client(o.partyId):vendor(o.partyId);const touched=(S.alloc[o.id]||[]).length>0;return `<tr><td><a href="#/${o.partyType.toLowerCase()}/${p.id}">${esc(p.name)}</a></td><td>${o.partyType}</td><td>${fd(o.date)}</td><td class="num">${money(o.amount)}<span class="sub">${o.amount<0?"advance":o.partyType==="Client"?"owed to us":"owed by us"}</span></td><td class="num">${money(S.settled[o.id]||0)}</td><td>${touched?'<span class="chip">Locked: money applied</span>':'<span class="chip accent">Can change</span>'}</td></tr>`}).join("")}</tbody></table><div class="tnote">Entered once per client or vendor, dated the day before go-live. Settled oldest first like a bill. Positive: a client owes us, or we owe a vendor. Negative: an advance.</div></div>`}};
ACTS.obNew=()=>{const br=sess().branch;const has=new Set(S.openings.map(o=>o.partyId));const opts=[...myClients().filter(c=>!has.has(c.id)).map(c=>`<option value="Client|${c.id}">Client · ${esc(c.name)}</option>`),...myVendors().filter(v=>!has.has(v.id)).map(v=>`<option value="Vendor|${v.id}">Vendor · ${esc(v.name)}</option>`)];
 if(!opts.length)return toast("Every client and vendor of this branch already has an opening balance.");
 openPanel({title:"Add opening balance",width:"narrow",body:`<div class="grid"><div class="field"><label for="obP">Client or vendor</label><select id="obP" class="input">${opts.join("")}</select></div>${sf("obA","Amount","",{hint:"Negative for an advance."})}${sf("obD","As of",addDays(S.fys.find(f=>f.id===sess().fy).from,-1),{ro:1,type:"date"})}</div>`,foot:`<button class="btn" data-act="pclose">Cancel</button><button class="btn primary" id="obGo">Save</button>`,
 mount:el=>{$("#obGo",el).onclick=()=>{const [t,id]=$("#obP",el).value.split("|");const a=+$("#obA",el).value;if(!a)return panelNote(el,"Enter a non-zero amount.");S.openings.push({id:uid("o"),branch:br,partyType:t,partyId:id,date:$("#obD",el).value,amount:a});settleAll();audit("Company Settings","Create","Opening balance",t,"",moneyT(a));closePanel();toast("Opening balance saved.");render()}}})};
SETSEC.openstock=()=>{const rows=S.batches.filter(b=>b.batchNo.startsWith("OB-"));return {body:`<div class="panel tw"><div class="ph">Opening stock<span class="r"><button class="btn sm" data-act="osImp">${ic("dl")}Import from Excel</button></span></div><table><thead><tr><th>Branch</th><th>Product</th><th>Batch</th><th>Expiry</th><th class="num">Qty</th><th class="num">Unit cost</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${branch(b.branch).name}</td><td class="mono">${prod(b.pid).partNo}</td><td class="mono">${b.batchNo}</td><td>${b.expiry?fd(b.expiry):"–"}</td><td class="num">${qtyf(b.qty)}</td><td class="num">${money(prod(b.pid).avg)}</td></tr>`).join("")}</tbody></table><div class="tnote">Stock held on go-live day, per branch and batch. Unit cost starts the average purchase rate.</div></div>`}};
ACTS.osImp=()=>toast("Import checks each row and lists problems before anything is saved.");
SETSEC.gst=()=>{const br=sess().branch;const months=[];for(let m=4;m<=15;m++){const y=m>12?2027:2026,mm=String(m>12?m-12:m).padStart(2,"0");months.push(`${y}-${mm}`)}
 return {body:`<div class="callout info"><div>Marking a month filed locks ${esc(branch(br).name)}'s invoices, credit notes and debit notes dated in it. Undo needs a reason and your password.</div></div><div class="monthgrid">${months.map(p=>{const g=S.gstFiled.find(x=>x.branch===br&&x.period===p);const ended=p<monthOf(TODAY);const n=S.docs.filter(d=>d.branch===br&&GST_KINDS.includes(d.kind)&&monthOf(d.date)===p&&d.status==="Saved").length;
  return `<div><b>${MON[+p.slice(5)-1]} ${p.slice(0,4)}</b><br>${g&&g.status==="Filed"?`<span class="chip">Filed ${fd(g.filedOn)}</span><span class="sub mono">${esc(g.arn||"")}</span><button class="btn sm ghost" data-act="gstUndo" data-p="${p}" style="margin-top:6px">Undo</button>`:ended?`<span class="faint">${n} documents</span><br><button class="btn sm" data-act="gstMark" data-p="${p}" style="margin-top:6px">Mark filed</button>${g&&g.status==="Undone"?'<span class="sub">Undone once</span>':""}`:`<span class="faint">Month not over</span>`}</div>`}).join("")}</div>`}};
ACTS.gstMark=a=>{const br=sess().branch,p=a.dataset.p;const n=S.docs.filter(d=>d.branch===br&&GST_KINDS.includes(d.kind)&&monthOf(d.date)===p).length;
 openPanel({title:`Mark ${MON[+p.slice(5)-1]} ${p.slice(0,4)} filed`,ctx:branch(br).name,width:"narrow",body:`<p>This locks <b>${n}</b> invoices, credit notes and debit notes dated in the month. Nobody can edit or cancel them after this; corrections become notes in an open month.</p><div class="grid">${sf("gD","Filed on",TODAY,{type:"date"})}${sf("gA","ARN (optional)","",{mono:1})}</div>`,foot:`<button class="btn" data-act="pclose">Cancel</button><button class="btn primary" id="gGo">Mark filed</button>`,
 mount:el=>{$("#gGo",el).onclick=()=>{const on=$("#gD",el).value;if(!on||on<addDays(p+"-28",3).slice(0,8)+"01")return panelNote(el,"The filing date must be after the month ends.");const ex=S.gstFiled.find(x=>x.branch===br&&x.period===p);if(ex)Object.assign(ex,{status:"Filed",filedOn:on,arn:$("#gA",el).value.trim()});else S.gstFiled.push({id:uid("g"),branch:br,period:p,filedOn:on,arn:$("#gA",el).value.trim(),status:"Filed",at:NOW()});audit("Company Settings","GST month filed",`${branch(br).name} · ${p}`,"status","","Filed");closePanel();toast("Month marked filed.");render()}}})};
ACTS.gstUndo=a=>{const br=sess().branch,p=a.dataset.p;confirmPw({title:`Undo filed ${MON[+p.slice(5)-1]} ${p.slice(0,4)}`,ctx:branch(br).name,danger:true,summary:"Documents in this month can change again. Only do this if the return was not actually filed.",action:"Undo",cb:r=>{const g=S.gstFiled.find(x=>x.branch===br&&x.period===p);g.status="Undone";audit("Company Settings","Status change",`${branch(br).name} · ${p}`,"GST month","Filed","Undone",r);setTimeout(render);return ""}})};
SETSEC.years=()=>({body:`<div class="panel tw"><div class="ph">Financial years</div><table><thead><tr><th>Year</th><th>From</th><th>To</th><th>Status</th><th></th></tr></thead><tbody>${S.fys.map(f=>`<tr><td><b>${f.id}</b></td><td>${fd(f.from)}</td><td>${fd(f.to)}</td><td>${stChip(f.status)}${f.closedAt?`<span class="sub">Closed ${fd(f.closedAt)} · ${esc(f.reason)}</span>`:""}</td><td>${f.status==="Open"?`<button class="btn sm" data-act="fyClose" data-id="${f.id}">Close year</button>`:'<span class="faint">Reopening is done by owner support</span>'}</td></tr>`).join("")}</tbody></table></div>`});
ACTS.fyClose=a=>{const f=S.fys.find(x=>x.id===a.dataset.id);const dr=S.docs.filter(d=>d.fy===f.id&&d.kind==="QT"&&d.status==="Draft").length;const tr=S.docs.filter(d=>d.fy===f.id&&d.kind==="DC"&&d.transit==="In transit"&&d.status==="Saved").length;const oa=Object.values(S.bal.c).reduce((s,b)=>s+b.onAccount,0);
 const done=f.to<TODAY;
 openPanel({title:`Close ${f.id}`,ctx:"Nothing in a closed year can change",body:`<p>Before closing, clear what's still open:</p><ul class="tl"><li><time>${dr?"Open":"Clear"}</time><span>${dr} draft quotations · <a href="#/quotations">Quotations</a></span></li><li><time>${tr?"Open":"Clear"}</time><span>${tr} declarations in transit · <a href="#/declarations">Declarations</a></span></li><li><time>${oa?"Note":"Clear"}</time><span>${moneyT(oa)} held on account for clients carries forward</span></li><li><time>${done?"Clear":"Open"}</time><span>${done?"The year has ended.":"The year ends "+fd(f.to)+". It can't be closed before then."}</span></li></ul>`,foot:`<button class="btn" data-act="pclose">Back</button><button class="btn danger" id="fyGo" ${done?"":"disabled"}>Close year</button>`,
 mount:el=>{$("#fyGo",el).onclick=()=>{closePanel();confirmPw({title:`Close ${f.id}`,danger:true,summary:"A snapshot of balances and stock is kept. Only owner support can reopen.",action:"Close year",cb:r=>{f.status="Closed";f.closedAt=TODAY;f.reason=r;audit("Company Settings","Status change","FY "+f.id,"status","Open","Closed",r);setTimeout(render);return ""}})}}})};


seed();render();
</script></body></html>
